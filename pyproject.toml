[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bupt-cli"
version = "0.5.2"
description = "Agent-friendly CLI for unofficial BUPT campus APIs (CAS, UCloud, portal, mobile JWGL, electricity)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "pi-implementer", email = "pi@local" }]
dependencies = [
    "httpx>=0.27.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
bupt = "bupt_cli.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bupt_cli"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
