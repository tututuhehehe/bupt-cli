[package]
name = "bupt"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "bupt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
cookie_store = { version = "0.22", default-features = false }
serde_json = "1"
url = { version = "2.5.8", default-features = false }

[dev-dependencies]
tempfile = "3"
