[package]
name = "bupt"
version = "0.6.0"
edition = "2024"
publish = false

[[bin]]
name = "bupt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions"] }
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
rpassword = "7.5.4"
serde_json = "1"
tempfile = "3"
time = { version = "0.3.55", default-features = false, features = ["local-offset", "parsing", "macros"] }
url = { version = "2.5.8", default-features = false }
zip = { version = "9.7.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
